<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro — TripExpress</title>
    <link rel="stylesheet" type="text/css" href="../styles/estilosUsuario.css">
</head>
<body>
    <main class="div-center">
    <h1>Registro</h1>
    <div>
        <input id="txtEmail" type="email" placeholder="Email" autocomplete="email">
    </div>
    <div>
        <input id="txtPass" type="password" placeholder="Contraseña" autocomplete="new-password">
    </div>
    <p class="ayuda">Mínimo 8 caracteres, con una mayúscula, una minúscula y un número.</p>
    <div>
        <button onclick="crear()">Crear usuario</button>
    </div>
    <p id="mensaje" class="mensaje-error" hidden></p>
    <div>
        <a href="login.html">Volver al login</a>
    </div>

    </main>

    <script src="../scripts/sesion.js"></script>
    <script src="../scripts/usuarios.js"></script>
</body>
</html>
