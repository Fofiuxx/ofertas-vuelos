<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — TripExpress</title>
    <link rel="stylesheet" type="text/css" href="../styles/estilosUsuario.css">
</head>
<body>
    <main class="div-center">
    <h1>Login</h1>
    <div>
        <input id="txtEmail" type="email" placeholder="Email" autocomplete="email">
    </div>
    <div>
        <input id="txtPass" type="password" placeholder="Contraseña" autocomplete="current-password">
    </div>
    <div>
        <button onclick="login()">Iniciar sesión</button>
    </div>
    <p id="mensaje" class="mensaje-error" hidden></p>
    <div>
        <a href="registro.html">Registrarse</a>
    </div>

    </main>

    <script src="../scripts/sesion.js"></script>
    <script src="../scripts/usuarios.js"></script>
</body>
</html>
